[project]
name = "citewise"
version = "0.1.0"
description = "Permission-aware RAG over company handbooks: hybrid search, reranking, cited answers, and an eval suite that gates CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harjas Singh Anand" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "typer>=0.12",
  "prometheus-client>=0.20",
  "fastembed>=0.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
# Static 256-d embeddings (16 MB, no ONNX runtime). Used for the embedding ablation in the eval.
lite = ["wordllama>=0.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "psycopg[binary,pool]>=3.2", "pgvector>=0.3"]

[project.scripts]
citewise = "citewise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
