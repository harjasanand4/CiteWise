# Postgres + pgvector, the API (which also serves the UI), and optional Prometheus.
#
#   docker compose up -d --build
#   docker compose run --rm api sh -c "citewise fetch && citewise ingest"
#   open http://localhost:8000
#
#   docker compose --profile observability up -d     # Prometheus on http://localhost:9090
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: citewise
      POSTGRES_PASSWORD: citewise
      POSTGRES_DB: citewise
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # so the test suite can use it too: TEST_DATABASE_URL=postgresql://citewise:citewise@localhost:5433/citewise
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      CITEWISE_DATABASE_URL: postgresql://citewise:citewise@db:5432/citewise
    ports:
      - "8000:8000"
    volumes:
      - corpora:/app/data
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

volumes:
  pgdata:
  corpora:
